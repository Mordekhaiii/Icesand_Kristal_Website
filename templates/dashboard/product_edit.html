{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} | PT. ICESAND KRISTAL PERKASA</title>
    <link rel="icon" href="{% static 'images/logo-icesand.png' %}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        form label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; margin-bottom: 0.5rem; display: block; }
        form input, form select, form textarea { 
            padding: 0.8rem 1rem; border-radius: 1rem; border: 1px solid #e2e8f0; font-size: 14px; outline: none; transition: all 0.2s; background: white; width: 100%;
        }
        form input:focus, form select:focus, form textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="max-w-xl w-full">
        <button onclick="window.history.back()" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-all font-bold text-sm">
            <i class="bi bi-arrow-left-circle-fill text-xl"></i> Kembali
        </button>

        <div class="bg-white rounded-[2.5rem] shadow-xl shadow-blue-900/5 border border-slate-200 overflow-hidden">
            <div class="bg-blue-600 p-8 text-white">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-md">
                        <i class="bi {% if is_edit %}bi-pencil-square{% else %}bi-plus-square-fill{% endif %} text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black italic uppercase tracking-tighter">{{ title }}</h1>
                        <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest">Manajemen Produk Icesand</p>
                    </div>
                </div>
            </div>

            <div class="p-8">
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        
        <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 space-y-5">
            
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Foto Produk</label>
                {% if is_edit and produk.foto %}
                <div class="flex items-center gap-4 mb-3">
                    <div class="w-20 h-20 bg-white rounded-2xl border border-slate-200 overflow-hidden p-2 shadow-sm">
                        <img src="{{ produk.foto.url }}" class="w-full h-full object-contain">
                    </div>
                    <div class="text-[9px] text-slate-400 italic">
                        <p class="font-bold text-slate-600">Foto aktif saat ini.</p>
                        <p>Unggah baru untuk mengganti.</p>
                    </div>
                </div>
                {% endif %}
                <input type="file" name="foto" id="id_foto" class="w-full file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-bold file:uppercase file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 transition-all cursor-pointer">
            </div>

            <div>
                <label for="id_nama" class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Nama Produk</label>
                <input type="text" name="nama" id="id_nama" 
                       value="{% if is_edit %}{{ produk.nama }}{% else %}{{ form.nama.value|default:'' }}{% endif %}" 
                       class="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700"
                       placeholder="Contoh: Es Kristal Bulat Besar">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="id_harga" class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Harga (Rp)</label>
                    <input type="number" name="harga" id="id_harga" 
                           value="{% if is_edit %}{{ produk.harga|floatformat:0 }}{% else %}{{ form.harga.value|default:'' }}{% endif %}" 
                           class="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700">
                </div>
                <div>
                    <label for="id_stok" class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Stok (Bal)</label>
                    <input type="number" name="stok" id="id_stok" 
                           value="{% if is_edit %}{{ produk.stok }}{% else %}{{ form.stok.value|default:0 }}{% endif %}" 
                           class="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700">
                </div>
            </div>

            <div>
                <label for="id_status" class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Status Produk</label>
                <select name="status" id="id_status" class="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700 appearance-none">
                    <option value="Tersedia" {% if is_edit %}{% if produk.status == 'Tersedia' %}selected{% endif %}{% else %}{% if form.status.value == 'Tersedia' %}selected{% endif %}{% endif %}>Tersedia</option>
                    <option value="Habis" {% if is_edit %}{% if produk.status == 'Habis' %}selected{% endif %}{% else %}{% if form.status.value == 'Habis' %}selected{% endif %}{% endif %}>Habis</option>
                </select>
            </div>

            <div>
                <label for="id_deskripsi" class="text-[10px] font-black uppercase text-slate-400 ml-1 mb-2 block">Deskripsi</label>
                <textarea name="deskripsi" id="id_deskripsi" rows="3" 
                          class="w-full p-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700"
                          placeholder="Detail produk...">{% if is_edit %}{{ produk.deskripsi }}{% else %}{{ form.deskripsi.value|default:'' }}{% endif %}</textarea>
            </div>

        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-100 transition-all uppercase tracking-widest text-xs italic">
            <i class="bi bi-check-circle-fill mr-2"></i> 
            {% if is_edit %}Simpan Perubahan{% else %}Tambahkan Produk{% endif %}
        </button>
    </form>
</div>
        </div>
    </div>

</body>
</html>
