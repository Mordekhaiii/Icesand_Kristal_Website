{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pengguna | ICESAND Admin</title>
    <link rel="icon" href="{% static 'images/logo-icesand.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <div class="mb-8">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2 text-slate-400 hover:text-blue-600 transition-all font-black text-[10px] uppercase tracking-widest">
                <i class="bi bi-arrow-left-circle text-xl"></i> Kembali ke Dashboard
            </a>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-50 bg-slate-50/50 flex items-center gap-6">
                <div class="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-100">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 uppercase italic tracking-tighter">Edit Pengguna</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic mt-1">Manajemen Pengguna</p>
                </div>
            </div>

            <form method="POST" class="p-8 md:p-12 space-y-8">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <h3 class="text-[11px] font-black text-slate-900 uppercase border-l-4 border-blue-600 pl-3">Autentikasi</h3>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-700 uppercase italic">Username</label>
                            <input type="text" value="{{ pelanggan.username }}" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold outline-none cursor-not-allowed" readonly>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-700 uppercase italic">Email</label>
                            <input type="email" name="email" value="{{ pelanggan.email }}" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-xs font-bold focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="space-y-6">
                        <h3 class="text-[11px] font-black text-slate-900 uppercase border-l-4 border-emerald-500 pl-3">Profil Bisnis</h3>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-700 uppercase italic">Nama Usaha</label>
                            <input type="text" name="nama_usaha" value="{{ pelanggan.nama_usaha|default:'' }}" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-xs font-bold focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-700 uppercase italic">No Telepon</label>
                            <input type="text" name="no_telepon" value="{{ pelanggan.no_telepon|default:'' }}" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-xs font-bold focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 outline-none">
                        </div>
                    </div>

                    <div class="col-span-1 md:col-span-2 space-y-2">
                        <label class="text-[10px] font-black text-slate-700 uppercase italic">Alamat Lengkap</label>
                        <textarea name="alamat" rows="3" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl text-xs font-bold focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none">{{ pelanggan.alamat|default:'' }}</textarea>
                    </div>
                </div>

                <div class="pt-8 border-t border-slate-50 flex justify-end gap-3">
                    <a href="{% url 'dashboard' %}" class="px-8 py-3.5 border border-slate-200 text-slate-400 rounded-2xl text-[10px] font-black uppercase hover:bg-slate-50 transition-all">Batal</a>
                    <button type="submit" class="px-12 py-3.5 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all transform hover:-translate-y-1">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
