{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Produk | PT. ICESAND KRISTAL PERKASA</title>
    <link rel="icon" href="{% static 'images/logo-icesand.png' %}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f1f5f9; 
        }
        /* Custom styling untuk form Django {{ form.as_p }} */
        form p {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        form label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.05em;
        }
        form input, form select, form textarea {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }
        form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="max-w-2xl w-full">
        <button onclick="window.history.back()" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-all font-bold text-sm">
            <i class="bi bi-arrow-left-circle-fill text-xl"></i> Kembali ke Dashboard
        </button>

        <div class="bg-white rounded-[2rem] shadow-xl shadow-blue-900/5 border border-slate-200 overflow-hidden">
            <div class="bg-blue-600 p-8 text-white">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-md">
                        <i class="bi bi-box-seam-fill text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-black italic uppercase tracking-tighter">Tambah Produk</h1>
                </div>
                <p class="text-blue-100 text-xs font-bold uppercase tracking-widest opacity-80">PT. ICESAND KRISTAL PERKASA</p>
            </div>

            <div class="p-8">
                <form method="POST" enctype="multipart/form-data" class="space-y-2">
                    {% csrf_token %}
                    
                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-8">
                        {{ form.as_p }}
                    </div>

                    <div class="flex flex-col md:flex-row gap-3">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-200 transition-all uppercase tracking-widest text-xs italic">
                            <i class="bi bi-cloud-arrow-up-fill mr-2"></i> Simpan & Publikasi
                        </button>
                        <a href="{% url 'dashboard' %}" class="px-8 py-4 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-xl transition-all uppercase tracking-widest text-xs text-center">
                            Batal
                        </a>
                    </div>
                </form>
            </div>
            
            <div class="bg-slate-50 p-4 border-t border-slate-100 text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pastikan data stok dan harga sudah sesuai sebelum disimpan.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
