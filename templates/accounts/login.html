{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Icesand Kristal</title>
    <link rel="icon" href="{% static 'images/logo-icesand.png' %}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,700;1,700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: url("{% static 'images/background_kristal.jpg' %}")
          no-repeat center center fixed;
        background-size: cover;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="h-screen flex items-center justify-center p-4">
    <div
      class="glass-card w-full max-w-md rounded-[2.5rem] shadow-2xl p-8 md:p-12 transition-all hover:shadow-blue-200/50"
    >
      <div class="text-center mb-10">
        <img src="{% static 'images/logo-icesand.png' %}" alt="Logo" class="w-24 h-24 mx-auto mb-2">
        <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Login</h2>
        <p
          class="text-slate-500 mt-2 text-sm font-medium tracking-wider"
        >
          Pelanggan PT. ICESAND KRISTAL PERKASA
        </p>
      </div>

      <form method="POST" action="{% url 'login' %}" class="space-y-5">
        {% csrf_token %}

       <div>
  <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 ml-1">
    Username
  </label>
  <div class="relative group">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
      <i
        data-feather="user"
        class="w-5 h-5 text-slate-400 group-focus-within:text-blue-600 transition-colors"
      ></i>
    </div>
    <input
      type="text"
      name="username"
      placeholder="Masukkan username"
      value="{{ last_username|default:'' }}"
      class="block w-full pl-12 pr-4 py-4 bg-white/60 border border-slate-200 rounded-2xl text-slate-900 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all shadow-sm"
      required
    />
  </div>
</div>

<div>
          <label
            class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 ml-1"
            >Password</label
          >
          <div class="relative group">
            <div
              class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
            >
              <i
                data-feather="lock"
                class="w-5 h-5 text-slate-400 group-focus-within:text-blue-600 transition-colors"
              ></i>
            </div>
            <input
              type="password"
              name="password"
              placeholder="Masukkan password"
              class="block w-full pl-12 pr-4 py-4 bg-white/60 border border-slate-200 rounded-2xl text-slate-900 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all shadow-sm"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-600/30 transform transition active:scale-[0.98] mt-2"
        >
          Masuk Sekarang
        </button>
      </form>

      <div class="mt-8 text-center border-t border-slate-100 pt-8">
        <p class="text-slate-500 text-sm">
          Belum punya akun?
          <a
            href="{% url 'register' %}"
            class="text-blue-600 font-bold hover:text-blue-700 hover:underline decoration-blue-200 underline-offset-4"
            >Daftar</a
          >
        </p>
      </div>
    </div>

    <script>
      feather.replace();

      // Radar Pesan Django
      {% if messages %}
        {% for message in messages %}
          console.log("Pesan Masuk: {{ message }} | Tag: {{ message.tags }}"); // Cek di Console F12

          Swal.fire({
            toast: true,
            position: 'top',
            icon: '{% if "error" in message.tags %}error{% else %}success{% endif %}',
            title: '{% if "error" in message.tags %}Gagal{% else %}Berhasil{% endif %}',
            text: '{{ message }}',
            showConfirmButton: false,
            timer: 3500,
            timerProgressBar: true
          });
        {% endfor %}
      {% endif %}
    </script>
  </body>
</html>
